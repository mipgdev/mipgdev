name: Metrics
on:
  # Actualiza la imagen cada 24 horas
  schedule: [{cron: "0 0 * * *"}]
  # Te permite ejecutarlo manualmente
  workflow_dispatch:
  # Actualiza si haces un push al repositorio
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: mipgdev
          template: classic
          base: header, repositories
          config_timezone: America/Caracas
          # Diseño oscuro minimalista
          config_theme: dark
          
          # Plugin 1: Lenguajes
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          
          # Plugin 2: Isocalendar (Gráfico de calor 3D)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # Plugin 3: Actividad reciente
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          
          # Plugin 4: Proyectos
          plugin_projects: yes
          plugin_projects_limit: 4
